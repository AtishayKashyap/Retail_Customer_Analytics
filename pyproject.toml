[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-analytics"
version = "2.0.0"
description = "Customer analytics warehouse and dashboard on the Olist Brazilian e-commerce dataset"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.5,<2",
    "filelock>=3.13,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "plotly>=6,<8",
    "pyarrow>=18,<24",
    "requests>=2.31,<3",
    "scipy>=1.12,<2",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pandas-stubs", "types-requests"]

[project.scripts]
retail = "retail_analytics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
retail_analytics = ["sql/*.sql"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src/retail_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
